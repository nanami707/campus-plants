      { id:3,name:'桂花',latinName:'Osmanthus fragrans',family:'木犀科',genus:'木犀属',category:'灌木',emoji:'🌼',color1:'#f5e6c8',color2:'#e8d5a0',description:'桂花香气馥郁…',floweringPeriod:'9-10月',features:['芳香浓郁','秋季开花'],locations:[{name:'教学楼A区花坛',lat:31.0253,lng:121.4378,desc:'金桂8棵'}]},
      { id:4,name:'梧桐',latinName:'Firmiana simplex',family:'梧桐科',genus:'梧桐属',category:'乔木',emoji:'🍁',color1:'#d4a574',color2:'#c49060',description:'梧桐是校园主干道的标志性行道树…',floweringPeriod:'6-7月开花',features:['阔叶遮阴','秋季落叶'],locations:[{name:'校园主干道',lat:31.0255,lng:121.4365,desc:'40余棵'}]},
      { id:5,name:'梅花',latinName:'Prunus mume',family:'蔷薇科',genus:'李属',category:'乔木',emoji:'🏵️',color1:'#f0d0d8',color2:'#e8b0c0',description:'梅花在寒冬中绽放…',floweringPeriod:'1-3月',features:['冬季开花','清香'],locations:[{name:'梅园',lat:31.0242,lng:121.4355,desc:'20余棵'}]},
      { id:6,name:'荷花',latinName:'Nelumbo nucifera',family:'莲科',genus:'莲属',category:'水生',emoji:'🪷',color1:'#e8c8d8',color2:'#d4a8c0',description:'荷花出淤泥而不染…',floweringPeriod:'6-9月',features:['水生植物','夏季开花'],locations:[{name:'荷花池',lat:31.0250,lng:121.4348,desc:'满池荷花'}]},
      { id:7,name:'紫藤',latinName:'Wisteria sinensis',family:'豆科',genus:'紫藤属',category:'藤本',emoji:'💜',color1:'#c8b8e8',color2:'#b0a0d8',description:'紫藤长廊是校园最浪漫的地方…',floweringPeriod:'4-5月',features:['藤本植物','紫色花瀑'],locations:[{name:'紫藤长廊',lat:31.0257,lng:121.4353,desc:'长约50米'}]},
      { id:8,name:'雪松',latinName:'Cedrus deodara',family:'松科',genus:'雪松属',category:'乔木',emoji:'🌲',color1:'#5a8a5c',color2:'#3d6b3e',description:'雪松四季常青…',floweringPeriod:'10-11月',features:['常绿','树形优美'],locations:[{name:'北门雪松林',lat:31.0272,lng:121.4362,desc:'约30棵'}]}
    ];

    let currentPlantId = null;
    let currentCheckinImageData = null;
    const STORAGE_KEY_CHECKINS = 'campus_plant_checkins_local';
    const STORAGE_KEY_COMMENT_IDS = 'my_comment_ids';   // 存储自己发表的评论ID
    let checkinCountsCache = {};

    // 获取自己发表的评论ID列表
    function getMyCommentIds() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY_COMMENT_IDS) || '[]');
    }
    function addMyCommentId(id) {
      const ids = getMyCommentIds();
      ids.push(id);
      localStorage.setItem(STORAGE_KEY_COMMENT_IDS, JSON.stringify(ids));
    }
    function removeMyCommentId(id) {
      let ids = getMyCommentIds();
      ids = ids.filter(cid => cid !== id);
      localStorage.setItem(STORAGE_KEY_COMMENT_IDS, JSON.stringify(ids));
    }

    // Supabase 操作
    async function loadAllCounts() {
      const { data } = await supabase.from('checkin_counts').select('*');
      if (data) data.forEach(item => { checkinCountsCache[item.plant_id] = item.count; });
    }
    async function fetchSingleCount(plantId) {
      const { data } = await supabase.from('checkin_counts').select('count').eq('plant_id', plantId).maybeSingle();
      return data ? data.count : 0;
    }
    async function incrementPlantCount(plantId) {
      const current = await fetchSingleCount(plantId);
      const newCount = current + 1;
      const { error } = await supabase.from('checkin_counts').upsert({ plant_id: plantId, count: newCount }, { onConflict: 'plant_id' });
      if (!error) { checkinCountsCache[plantId] = newCount; return newCount; }
      return current;
    }
    async function fetchComments(plantId) {
      const { data } = await supabase.from('comments').select('*').eq('plant_id', plantId).order('created_at', { ascending: false });
      return data || [];
    }
    async function addCommentToServer(plantId, content, username) {
      const { data, error } = await supabase.from('comments').insert([{ plant_id: plantId, content, username }]).select().single();
      return error ? null : data;
    }
    async function deleteCommentFromServer(commentId) {
      const { error } = await supabase.from('comments').delete().eq('id', commentId);
      return !error;
    }

    // 本地打卡记录
    function getMyCheckins() { return JSON.parse(localStorage.getItem(STORAGE_KEY_CHECKINS) || '[]'); }
    function saveMyCheckins(list) { localStorage.setItem(STORAGE_KEY_CHECKINS, JSON.stringify(list)); }
    function addMyCheckin(record) { const list = getMyCheckins(); list.unshift(record); saveMyCheckins(list); updateBadge(); }
    function removeMyCheckin(id) { saveMyCheckins(getMyCheckins().filter(r => r.id !== id)); updateBadge(); }
    function updateBadge() {
      const count = getMyCheckins().length;
      const badge = document.getElementById('myCheckinsBadge');
      if (count > 0) { badge.style.display = 'flex'; badge.textContent = count > 99 ? '99+' : count; }
      else badge.style.display = 'none';
    }

    // UI 元素
    const $plantList = document.getElementById('plantList');
    const $emptyState = document.getElementById('emptyState');
    const $searchInput = document.getElementById('searchInput');
    const $searchClear = document.getElementById('searchClear');
    const $categoryTabs = document.getElementById('categoryTabs');
    const $detailOverlay = document.getElementById('detailOverlay');
    const $detailContent = document.getElementById('detailContent');
    const $detailHero = document.getElementById('detailHero');
    const $detailHeroEmoji = document.getElementById('detailHeroEmoji');
    const $detailHeaderTitle = document.getElementById('detailHeaderTitle');
    const $checkinModalOverlay = document.getElementById('checkinModalOverlay');
    const $checkinPlantName = document.getElementById('checkinPlantName');
    const $checkinPreview = document.getElementById('checkinPreview');
    const $checkinPlaceholder = document.getElementById('checkinPlaceholder');
    const $checkinPreviewImg = document.getElementById('checkinPreviewImg');
    const $checkinNote = document.getElementById('checkinNote');
    const $btnSubmitCheckin = document.getElementById('btnSubmitCheckin');
    const $fileInput = document.getElementById('fileInput');
    const $toast = document.getElementById('toast');
    const $myCheckinsPage = document.getElementById('myCheckinsPage');
    const $myCheckinsList = document.getElementById('myCheckinsList');
    const $myCheckinsEmpty = document.getElementById('myCheckinsEmpty');

    let activeCategory = '全部';
    let searchQuery = '';

    function showToast(msg) {
      $toast.textContent = msg;
      $toast.classList.add('show');
      clearTimeout($toast._timeout);
      $toast._timeout = setTimeout(() => $toast.classList.remove('show'), 1800);
    }

    function getFilteredPlants() {
      let plants = plantData;
      if (activeCategory !== '全部') plants = plants.filter(p => p.category === activeCategory);
      if (searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        plants = plants.filter(p => p.name.toLowerCase().includes(q) || p.latinName.toLowerCase().includes(q) || p.features.some(f => f.toLowerCase().includes(q)));
      }
      return plants;
    }

    function renderPlantList() {
      const plants = getFilteredPlants();
      if (plants.length === 0) {
        $plantList.innerHTML = '';
        $emptyState.style.display = 'block';
      } else {
        $emptyState.style.display = 'none';
        $plantList.innerHTML = plants.map(p => {
          const count = checkinCountsCache[p.id] !== undefined ? checkinCountsCache[p.id] : 0;
          return `<div class="plant-card" data-plant-id="${p.id}" onclick="openDetail(${p.id})">
            <div class="plant-card-image" style="background:linear-gradient(135deg, ${p.color1} 0%, ${p.color2} 60%, ${p.color1} 100%);">
              <span class="plant-emoji">${p.emoji}</span>
              <span class="plant-card-badge">${p.category}</span>
            </div>
            <div class="plant-card-body">
              <div class="plant-card-name">${p.name}</div>
              <div class="plant-card-latin">${p.latinName}</div>
              <div class="plant-card-desc">${p.description.substring(0,50)}...</div>
              <div class="plant-card-footer">
                <div class="plant-card-tags">${p.features.slice(0,2).map(f=>`<span class="plant-tag">${f}</span>`).join('')}</div>
                <div class="plant-card-checkins"><span class="checkin-icon">📸</span> ${count}人打卡</div>
              </div>
            </div>
          </div>`;
        }).join('');
      }
    }

    async function openDetail(plantId) {
      const plant = plantData.find(p => p.id === plantId);
      if (!plant) return;
      currentPlantId = plantId;
      const count = await fetchSingleCount(plantId);
      checkinCountsCache[plantId] = count;
      const comments = await fetchComments(plantId);
      const myCommentIds = getMyCommentIds();

      $detailHeaderTitle.textContent = plant.name;
      $detailHero.style.background = `linear-gradient(160deg, ${plant.color1} 0%, ${plant.color2} 50%, ${plant.color1} 100%)`;
      $detailHeroEmoji.textContent = plant.emoji;

      const mapMarkersHTML = plant.locations.map((loc, i) => {
        const left = 15 + i*28 + Math.sin(i*1.5)*8;
        const top = 25 + i*20 + Math.cos(i*1.8)*10;
        return `<div class="map-marker" style="left:${left}%;top:${top}%;"><div class="map-marker-label">${loc.name}</div><div class="map-marker-pin">${i+1}</div></div>`;
      }).join('');

      $detailContent.innerHTML = `
        <div class="detail-info-card">
          <div class="detail-plant-name">${plant.name}</div>
          <div class="detail-plant-latin">${plant.latinName}</div>
          <div class="detail-plant-meta"><span>📚 ${plant.family}</span><span>🌿 ${plant.genus}</span><span>📅 ${plant.floweringPeriod}</span></div>
          <div class="detail-plant-desc">${plant.description}</div>
        </div>
        <div class="map-section">
          <div class="map-section-title">📍 校园分布地图</div>
          <div class="map-container"><div class="map-placeholder"><div class="map-grid"></div>${mapMarkersHTML}<div class="map-legend"><span class="map-legend-dot"></span> ${plant.name}分布 (${plant.locations.length}处)</div></div></div>
          <div style="padding:8px 16px 4px;font-size:var(--font-xs);color:var(--gray-500);">${plant.locations.map((l,i)=>`🔴${i+1}. ${l.name}`).join(' ')}</div>
        </div>
        <div class="checkin-stats" onclick="openCheckinModal(${plant.id})">
          <span class="checkin-stats-icon">📸</span>
          <div class="checkin-stats-info"><div class="checkin-stats-count" id="detailCheckinCount">${count}</div><div class="checkin-stats-label">已打卡学生数</div></div>
          <button class="btn-checkin" onclick="event.stopPropagation();openCheckinModal(${plant.id})">📷 打卡</button>
        </div>
        <div class="comment-section">
          <div class="comment-section-title">💬 评论 (${comments.length})</div>
          <div class="comment-list" id="commentList">
            ${comments.length === 0 ? '<div style="text-align:center;color:var(--gray-400);padding:20px;">暂无评论，来说两句吧~</div>' : 
              comments.map(c => {
                const isMine = myCommentIds.includes(c.id);
                return `<div class="comment-item">
                  <div class="comment-avatar">${c.username.charAt(0)}</div>
                  <div class="comment-body">
                    <span class="comment-username">${c.username}</span>
                    <span class="comment-time">${c.created_at}</span>
                    <div class="comment-text">${c.content}</div>
                  </div>
                  ${isMine ? `<button class="comment-delete-btn" onclick="deleteComment('${c.id}')" title="删除我的评论">🗑️</button>` : ''}
                </div>`;
              }).join('')}
          </div>
          <div class="comment-input-row">
            <input type="text" class="comment-input" id="commentInput" placeholder="写下你的评论..." maxlength="200">
            <button class="btn-send-comment" id="btnSendComment">发送</button>
          </div>
        </div>
      `;

      $detailOverlay.classList.add('visible');
      document.body.style.overflow = 'hidden';
      $detailOverlay.scrollTop = 0;

      const commentInput = document.getElementById('commentInput');
      const btnSend = document.getElementById('btnSendComment');
      if (commentInput && btnSend) {
        const sendHandler = async () => {
          const content = commentInput.value.trim();
          if (!content) { showToast('请输入评论内容'); return; }
          const names = ['小明','小红','小华','小丽','阿杰','小林','小美'];
          const username = names[Math.floor(Math.random()*names.length)] + '同学';
          const newComment = await addCommentToServer(currentPlantId, content, username);
          if (newComment) {
            addMyCommentId(newComment.id);   // 保存评论ID到本地
            commentInput.value = '';
            showToast('评论发送成功！');
            openDetail(currentPlantId);     // 刷新评论区
          } else {
            showToast('评论发送失败，请稍后重试');
          }
        };
        btnSend.addEventListener('click', sendHandler);
        commentInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendHandler(); });
      }
    }

    // 删除评论函数（暴露到全局）
    window.deleteComment = async function(commentId) {
      const success = await deleteCommentFromServer(commentId);
      if (success) {
        removeMyCommentId(commentId);
        showToast('评论已删除');
        if (currentPlantId) openDetail(currentPlantId);
      } else {
        showToast('删除失败');
      }
    };

    function closeDetail() {
      $detailOverlay.classList.remove('visible');
      document.body.style.overflow = '';
      currentPlantId = null;
      renderPlantList();
    }

    function openCheckinModal(plantId) {
      const plant = plantData.find(p => p.id === plantId);
      if (!plant) return;
      currentPlantId = plantId;
      $checkinPlantName.textContent = plant.name;
      $checkinPreviewImg.style.display = 'none';
      $checkinPlaceholder.style.display = 'block';
      $checkinNote.value = '';
      $btnSubmitCheckin.disabled = true;
      currentCheckinImageData = null;
      $checkinModalOverlay.classList.add('visible');
      document.body.style.overflow = 'hidden';
    }
    function closeCheckinModal() {
      $checkinModalOverlay.classList.remove('visible');
      if (!$detailOverlay.classList.contains('visible') && !$myCheckinsPage.classList.contains('visible')) document.body.style.overflow = '';
    }
    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        currentCheckinImageData = ev.target.result;
        $checkinPreviewImg.src = currentCheckinImageData;
        $checkinPreviewImg.style.display = 'block';
        $checkinPlaceholder.style.display = 'none';
        $btnSubmitCheckin.disabled = false;
      };
      reader.readAsDataURL(file);
      $fileInput.value = '';
    }
    async function submitCheckin() {
      if (!currentCheckinImageData || !currentPlantId) { showToast('请先拍照或选择图片'); return; }
      const plant = plantData.find(p => p.id === currentPlantId);
      const note = $checkinNote.value.trim();
      const newCount = await incrementPlantCount(currentPlantId);
      const record = {
        id: 'ch_' + Date.now(), plantId: currentPlantId, plantName: plant.name, plantEmoji: plant.emoji,
        imageData: currentCheckinImageData, time: new Date().toLocaleString(), note: note || '打卡记录'
      };
      addMyCheckin(record);
      closeCheckinModal();
      showToast(`🎉 打卡成功！${plant.name}已有${newCount}人打卡`);
      if ($detailOverlay.classList.contains('visible') && currentPlantId) openDetail(currentPlantId);
      renderPlantList();
    }

    function openMyCheckins() {
      const list = getMyCheckins();
      if (list.length === 0) {
        $myCheckinsList.innerHTML = '';
        $myCheckinsEmpty.style.display = 'block';
      } else {
        $myCheckinsEmpty.style.display = 'none';
        $myCheckinsList.innerHTML = list.map(r => `
          <div class="checkin-record-card">
            <img class="checkin-record-img" src="${r.imageData}" onerror="this.style.background='var(--gray-200)';">
            <div class="checkin-record-info">
              <div class="checkin-record-plant">${r.plantEmoji} ${r.plantName}</div>
              <div class="checkin-record-time">${r.time}</div>
              <div class="checkin-record-note">${r.note}</div>
            </div>
            <button class="checkin-record-delete" data-id="${r.id}">删除</button>
          </div>
        `).join('');
        document.querySelectorAll('.checkin-record-delete').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.target.dataset.id;
            if (confirm('删除这条打卡记录？')) { removeMyCheckin(id); openMyCheckins(); showToast('记录已删除'); }
          });
        });
      }
      $myCheckinsPage.classList.add('visible');
      document.body.style.overflow = 'hidden';
      $myCheckinsPage.scrollTop = 0;
    }
    function closeMyCheckins() {
      $myCheckinsPage.classList.remove('visible');
      if (!$detailOverlay.classList.contains('visible')) document.body.style.overflow = '';
      renderPlantList();
    }

    // 事件绑定
    $searchInput.addEventListener('input', function() {
      searchQuery = this.value;
      $searchClear.classList.toggle('visible', searchQuery.length > 0);
      renderPlantList();
    });
    $searchClear.addEventListener('click', () => { $searchInput.value = ''; searchQuery = ''; $searchClear.classList.remove('visible'); renderPlantList(); });
    $categoryTabs.addEventListener('click', e => {
      const tab = e.target.closest('.category-tab');
      if (!tab) return;
      activeCategory = tab.dataset.category;
      document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderPlantList();
    });
    document.getElementById('btnBack').addEventListener('click', closeDetail);
    document.getElementById('btnBackMyCheckins').addEventListener('click', closeMyCheckins);
    $checkinPreview.addEventListener('click', () => $fileInput.click());
    $fileInput.addEventListener('change', handleFileSelect);
    document.getElementById('btnCancelCheckin').addEventListener('click', closeCheckinModal);
    $btnSubmitCheckin.addEventListener('click', submitCheckin);
    $checkinModalOverlay.addEventListener('click', e => { if (e.target === $checkinModalOverlay) closeCheckinModal(); });
    document.getElementById('btnMyCheckins').addEventListener('click', openMyCheckins);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if ($checkinModalOverlay.classList.contains('visible')) closeCheckinModal();
        else if ($detailOverlay.classList.contains('visible')) closeDetail();
        else if ($myCheckinsPage.classList.contains('visible')) closeMyCheckins();
      }
    });

    window.openDetail = openDetail;
    window.openCheckinModal = openCheckinModal;

    async function init() {
      updateBadge();
      await loadAllCounts();
      renderPlantList();
    }
    init();
  })();
</script>
</body>
</html>
